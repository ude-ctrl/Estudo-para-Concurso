name: Validar plataforma

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: node tests/climatologia-candidate.browser.mjs
      - run: node tests/climatologia-candidate.browser.mjs
        env:
          CLIMA_PREVIEW_FILE: public/previas/climatologia.html
      - run: node scripts/build-climatologia-02.mjs --check
      - run: node tests/climatologia-candidate.browser.mjs
        env:
          CLIMA_PREVIEW_FILE: docs/v6-climatologia/candidata/0.2.0/previa.html
      - run: npm run test:e2e
